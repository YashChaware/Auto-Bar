name: Build AutoBar Executable

on:
  push:
    branches: [ main ]
    paths:
      - 'autobar.cpp'
  workflow_dispatch:

jobs:
  compile:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up MSVC Compiler
        uses: ilammy/msvc-dev-cmd@v1

      - name: Compile AutoBar.exe & Generate Log
        shell: cmd
        run: |
          cl /O2 /W4 /EHsc autobar.cpp /link user32.lib shell32.lib advapi32.lib /SUBSYSTEM:WINDOWS /OUT:AutoBar.exe > build.log 2>&1
          type build.log

      - name: Save build.log as Downloadable Artifact
        uses: actions/upload-artifact@v4
        if: always()  # Saves the log file even if compilation fails!
        with:
          name: msvc-build-log-${{ github.sha }}
          path: build.log
          retention-days: 14

      - name: Generate Build Summary in GitHub UI
        shell: bash
        run: |
          echo "### 📊 Build Diagnostics & Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Timestamp:** $(date -u)" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit SHA:** \`${GITHUB_SHA:0:7}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Binary Size:** $(wc -c < AutoBar.exe) bytes" >> $GITHUB_STEP_SUMMARY

      - name: Commit and Push Updated Executable
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "build: auto-update AutoBar.exe binary [skip ci]"
          file_pattern: "AutoBar.exe"