name: Release Pipeline

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Select Release Type (patch: nested sub-release | minor: new top-level version)'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
      release_name_prefix:
        description: 'Release Name Codename / Suffix (e.g., Velocity)'
        required: true
        default: 'Velocity'
      release_notes:
        description: 'Release Notes / Changelog Entries (leave blank to auto-generate from commits)'
        required: false
        type: string
        default: ''
      is_prerelease:
        description: 'Mark as Pre-Release? (Ignored on Main)'
        required: true
        type: boolean
        default: false
      is_draft:
        description: 'Save as Draft? (Ignored on Main if desired)'
        required: true
        type: boolean
        default: false

jobs:
  manage-release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect Environment & Auto-Calculate Version
        shell: pwsh
        run: |
          $currentBranch = "${{ github.ref_name }}"
          Write-Host "Current Target Branch: $currentBranch"

          # Determine environment mode
          $envMode = "production"
          if ($currentBranch -eq "dev") {
              $envMode = "dry-run"
          } elseif ($currentBranch -eq "uat") {
              $envMode = "uat"
          }
          Write-Host "Execution Mode: $envMode"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Fetch tags
          git fetch --tags
          
          # Find latest tag
          $latestTag = (git describe --tags --abbrev=0 2>$null)
          if (-not $latestTag) {
              $latestTag = "v1.0.0"
          }
          Write-Host "Latest existing tag detected: $latestTag"
          
          # Parse SemVer
          $cleanTag = $latestTag -replace '^v', ''
          $parts = $cleanTag.Split('.')
          [int]$major = $parts[0]
          [int]$minor = $parts[1]
          [int]$patch = $parts[2]
          
          # Increment based on dropdown selection
          $releaseType = "${{ inputs.release_type }}"
          if ($releaseType -eq "minor") {
              $minor++
              $patch = 0
              Write-Host "Performing Minor version bump..."
          } else {
              $patch++
              Write-Host "Performing Patch version bump..."
          }
          
          $newVersion = "v$major.$minor.$patch"
          $codename = "${{ inputs.release_name_prefix }}"
          $newTitle = "$newVersion — $codename"
          
          # Handle Release Notes
          $inputNotes = "${{ inputs.release_notes }}"
          if ([string]::IsNullOrWhiteSpace($inputNotes)) {
              Write-Host "Auto-generating context from git commit history since $latestTag..."
              $gitCommits = git log "$latestTag..HEAD" --pretty=format:"- %s" 2>$null
              if ([string]::IsNullOrWhiteSpace($gitCommits)) {
                  $notes = "- **Update:** Routine maintenance and stability improvements."
              } else {
                  $notes = $gitCommits
              }
          } else {
              $notes = $inputNotes
          }
          
          # Format Markdown structure based on release type hierarchy
          if ($releaseType -eq "minor") {
              $readmeEntry = "`n### 🚀 $newTitle`n$notes`n"
              $releaseBody = "### 🚀 $newTitle`n$notes"
          } else {
              $readmeEntry = "`n#### 🔧 Patch $newTitle`n$notes`n"
              $releaseBody = "#### 🔧 Patch $newTitle`n$notes"
          }

          # Export variables to GitHub Environment
          echo "ENV_MODE=$envMode" >> $env:GITHUB_ENV
          echo "RELEASE_VERSION=$newVersion" >> $env:GITHUB_ENV
          echo "RELEASE_TITLE=$newTitle" >> $env:GITHUB_ENV
          echo "RELEASE_TYPE=$releaseType" >> $env:GITHUB_ENV

          "README_ENTRY<<EOF" >> $env:GITHUB_ENV
          $readmeEntry >> $env:GITHUB_ENV
          "EOF" >> $env:GITHUB_ENV

          "RELEASE_BODY<<EOF" >> $env:GITHUB_ENV
          $releaseBody >> $env:GITHUB_ENV
          "EOF" >> $env:GITHUB_ENV

      - name: Dry-Run Simulation Log (Dev Branch Only)
        if: env.ENV_MODE == 'dry-run'
        shell: pwsh
        run: |
          Write-Host "========================================="
          Write-Host "[DRY-RUN SIMULATION] No files changed."
          Write-Host "Target Version: ${{ env.RELEASE_VERSION }}"
          Write-Host "Release Title:  ${{ env.RELEASE_TITLE }}"
          Write-Host "Release Type:   ${{ env.RELEASE_TYPE }}"
          Write-Host "-----------------------------------------"
          Write-Host "Generated Changelog Entry for README & Release:"
          Write-Host "${{ env.README_ENTRY }}"
          Write-Host "========================================="

      - name: Update README.md Hierarchy (UAT & Main)
        if: env.ENV_MODE != 'dry-run'
        shell: pwsh
        run: |
          $readmePath = "README.md"
          $marker = "## Version History & Changelog"
          $type = "${{ env.RELEASE_TYPE }}"
          $readmeEntry = "${{ env.README_ENTRY }}"

          if (Test-Path $readmePath) {
              $content = Get-Content $readmePath -Raw

              if ($content.Contains($marker)) {
                  if ($type -eq "minor") {
                      $updatedContent = $content.Replace("$marker", "$marker`n$readmeEntry")
                      Write-Host "[SUCCESS] Added new top-level minor version heading to README.md."
                  } 
                  else {
                      if ($content -match '### 🚀') {
                          $parts = $content -split '### 🚀', 2
                          $updatedContent = $parts[0] + '### 🚀' + $parts[1].Insert(0, $readmeEntry)
                          Write-Host "[SUCCESS] Nested patch release under latest minor version in README.md."
                      } else {
                          $updatedContent = $content.Replace("$marker", "$marker`n$readmeEntry")
                      }
                  }

                  [System.IO.File]::WriteAllText((Get-Item $readmePath).FullName, $updatedContent)
              }
              else {
                  Write-Error "[ERROR] Marker '$marker' not found in README.md!"
                  exit 1
              }
          }
          else {
              Write-Error "[ERROR] README.md file not found!"
              exit 1
          }

      - name: Commit and Push Updated README.md (UAT & Main)
        if: env.ENV_MODE != 'dry-run'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs: update README.md changelog hierarchy for ${{ env.RELEASE_VERSION }} [skip ci]"
          file_pattern: "README.md"

      - name: Create and Push Git Tag (UAT & Main)
        if: env.ENV_MODE != 'dry-run'
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ env.RELEASE_VERSION }}" -m "${{ env.RELEASE_TITLE }}"
          git push origin "${{ env.RELEASE_VERSION }}"

      - name: Publish Staging GitHub Release (UAT Branch)
        if: env.ENV_MODE == 'uat'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_VERSION }}
          name: "[UAT STAGING] ${{ env.RELEASE_TITLE }}"
          body: ${{ env.RELEASE_BODY }}
          prerelease: true
          draft: true
          files: AutoBar.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Production GitHub Release (Main Branch)
        if: env.ENV_MODE == 'production'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_VERSION }}
          name: ${{ env.RELEASE_TITLE }}
          body: ${{ env.RELEASE_BODY }}
          prerelease: ${{ inputs.is_prerelease }}
          draft: ${{ inputs.is_draft }}
          files: AutoBar.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}