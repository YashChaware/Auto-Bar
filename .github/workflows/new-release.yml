name: Interactive Release

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Release Version Tag (e.g., v1.0.1)'
        required: true
        default: 'v1.0.1'
      release_title:
        description: 'Release Title (e.g., v1.0.1 — Horizon)'
        required: true
        default: 'v1.0.1 — Horizon'
      release_notes:
        description: 'Release Notes / Changelog Entries'
        required: true
        type: string
        default: |
          - **Feature:** Added automated changelog synchronization.
          - **Fix:** Fixed edge hover timer behavior.
      is_prerelease:
        description: 'Mark as Pre-Release?'
        required: true
        type: boolean
        default: false
      is_draft:
        description: 'Save as Draft?'
        required: true
        type: boolean
        default: false

jobs:
  create-release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up MSVC Compiler
        uses: ilammy/msvc-dev-cmd@v1

      - name: Compile AutoBar.exe
        run: |
          cl /O2 /W4 /EHsc autobar.cpp /link user32.lib shell32.lib advapi32.lib /SUBSYSTEM:WINDOWS /OUT:AutoBar.exe

      - name: Update README.md with New Release Notes
        shell: pwsh
        env:
          RELEASE_TITLE: ${{ inputs.release_title }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: |
          $readmePath = "README.md"
          if (Test-Path $readmePath) {$content = Get-Content $readmePath -Raw$marker = "## Version History & Changelog"
              
              $newEntry = "`n### 🚀 `$env:RELEASE_TITLE`n`$env:RELEASE_NOTES`n"
              
              if ($content -match [regex]::Escape($marker)) {
                  $updatedContent = $content -replace [regex]::Escape($marker), "$marker`n$newEntry"
                  [System.IO.File]::WriteAllText((Get-Item $readmePath).FullName, $updatedContent)
                  Write-Host "[SUCCESS] README.md successfully updated with new release notes."
              } else {
                  Write-Error "[ERROR] Marker '$marker' not found in README.md!"
              }
          } else {
              Write-Error "[ERROR] README.md file not found!"
          }

      - name: Commit and Push Updated README.md & AutoBar.exe
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs: auto-update README.md changelog for ${{ inputs.release_version }} [skip ci]"
          file_pattern: "README.md AutoBar.exe"

      - name: Create and Push Git Tag
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag ${{ inputs.release_version }}
          git push origin ${{ inputs.release_version }}

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_version }}
          name: ${{ inputs.release_title }}
          body: ${{ inputs.release_notes }}
          prerelease: ${{ inputs.is_prerelease }}
          draft: ${{ inputs.is_draft }}
          files: AutoBar.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}